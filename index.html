<style>
/* ============ 露營手帳：樣式 ============ */
:root{
  --ink:#24324a;--ink2:#5b6577;--ink3:#8a93a3;
  --paper:#fbf6ea;--card:#fffdf8;--kraft:#f6efe1;--dot:#d6c8ad;
  --rule:#c4d4e5;--margin:#e3a19b;--w1:#edbd55;--w2:#f1c96c;
  --stamp:#c8433a;--ok:#7cc58f;
  --hand:'LXGW WenKai TC','Kaiti TC','BiauKai','DFKai-SB','STKaiti','KaiTi',serif;
  --num:'Caveat','LXGW WenKai TC',cursive;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --hd-h:96px;--tb-h:62px;--sb:env(safe-area-inset-bottom,0px);
  --sh:2px 3px 0 rgba(36,50,74,.14);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--kraft);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:18px 18px;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.noscript{max-width:560px;margin:40px auto;padding:16px;font-size:16px}
.shell{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
main{padding-bottom:calc(var(--tb-h) + var(--sb) + 28px)}

/* ---------- 上方：郵戳＋出發體力 ---------- */
.hd{position:sticky;top:0;z-index:40;background:repeating-linear-gradient(-45deg,var(--w1) 0 10px,var(--w2) 10px 20px);border-bottom:1.5px solid var(--ink);box-shadow:0 4px 0 rgba(36,50,74,.08);padding-top:env(safe-area-inset-top,0px)}
.hd-in{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:8px 12px 7px 10px}
.pm{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border:2.5px solid var(--stamp);border-radius:50%;background:var(--paper);color:var(--stamp);text-decoration:none;transform:rotate(-9deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px rgba(200,67,58,.4)}
.pm b{font-family:var(--num);font-size:23px;font-weight:700;line-height:.9;white-space:nowrap}
.pm b.zh{font-family:var(--hand);font-size:14px;line-height:1.1}
.pm small{font-size:9.5px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.st{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.st-top{display:flex;align-items:baseline;gap:6px;min-width:0}
.st-l{font-family:var(--hand);font-size:14.5px;font-weight:700;white-space:nowrap}
.st-p{font-family:var(--num);font-size:21px;font-weight:700;line-height:1}
.st-mini{margin-left:auto;display:flex;gap:9px;white-space:nowrap}
.mini{font-size:12px;font-weight:700;text-decoration:none}
.mini b{font-family:var(--num);font-size:17px;margin-left:2px}
.mini.full b{color:#2f7a45}
.bar{display:flex;height:16px;overflow:hidden;border:2px solid var(--ink);border-radius:255px 12px 225px 12px/12px 225px 12px 255px;background:var(--paper)}
.bar i{display:block;flex:none;width:0;height:100%;background:var(--c);box-shadow:inset 1.5px 0 0 var(--ink);transition:width .5s ease}
.bar i.ok{background:var(--ok);box-shadow:none}
.chips{display:flex;gap:6px;margin:-4px -12px -4px 0;padding:4px 12px 4px 0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 6px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip::after{content:"";position:absolute;inset:-4px -3px}
.chip i{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:3px;background:var(--c)}
.chip b{font-family:var(--num);font-size:16px;line-height:1}
.chip.ok{background:var(--ok);cursor:default}

/* ---------- 下方分頁列 ---------- */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1.5px solid var(--ink);box-shadow:0 -4px 0 rgba(36,50,74,.06);padding-bottom:var(--sb)}
.tb-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto;padding:6px 8px}
.tb a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:48px;border:1.5px solid transparent;border-radius:14px;font-family:var(--hand);font-size:13px;font-weight:700;color:var(--ink2);text-decoration:none}
.tb a svg{width:24px;height:24px}
.tb a[aria-current="page"]{color:var(--ink);border-color:var(--ink);background:repeating-linear-gradient(-45deg,var(--w1) 0 8px,var(--w2) 8px 16px)}
.tb .dot{position:absolute;top:1px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 4px;border:1.5px solid var(--ink);border-radius:999px;background:var(--stamp);color:#fff;font-family:var(--num);font-size:15px;font-weight:700;line-height:15px;text-align:center}

/* ---------- 共用 ---------- */
.view{padding-top:16px;animation:viewIn .35s ease both}
.eyebrow{margin:0;font-family:var(--num);font-size:16px;font-weight:700;letter-spacing:.4px;color:var(--ink2)}
.sec-h{margin:20px 0 2px}
.sec-h h2{margin:0;font-family:var(--hand);font-size:24px;line-height:1.25}
.sec-h p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.bub{position:absolute;z-index:8;width:max-content;max-width:200px;margin:0;padding:7px 11px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:var(--sh);font-family:var(--hand);font-size:14px;font-weight:700;line-height:1.38;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .28s cubic-bezier(.34,1.56,.64,1);transform:translateY(6px) scale(.9)}
.bub.show{opacity:1;transform:none}
.bub:empty{display:none}

/* ---------- 寄居帳（吉祥物） ---------- */
.pc{display:block;overflow:visible}
.walker-in .pc,.pc-side .pc,.t-pc .pc,.share-pc .pc{width:100%;height:100%}
.pc .pc-b{transform-box:fill-box;transform-origin:50% 100%;animation:pcBob 2.8s ease-in-out infinite}
.pc .e-round{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.8s infinite}
.pc .flag{transform-box:fill-box;transform-origin:0 50%;animation:sway 1.8s ease-in-out infinite}
.pc .claw{transform-box:fill-box;transform-origin:100% 56%}
.pc .legs{transform-box:fill-box;transform-origin:50% 0}
.pc .e-happy,.pc .hide-g,.pc .spark{display:none}
.pc.cheer .e-round,.pc.yay .e-round{display:none}
.pc.cheer .e-happy,.pc.yay .e-happy,.pc.cheer .spark,.pc.yay .spark{display:inline}
.pc.cheer .claw{animation:clawWave .45s ease-in-out infinite alternate}
.pc.oops .out-g{display:none}
.pc.oops .hide-g{display:inline}
.pc.oops .pc-b,.pc.nervous .pc-b{animation:pcShake .16s linear infinite}
.pc.hop-a .pc-b{animation:pcHopA .55s cubic-bezier(.3,1.4,.5,1)}
.pc.hop-b .pc-b{animation:pcHopB .55s cubic-bezier(.3,1.4,.5,1)}
.walking .pc .pc-b{animation:pcSide .3s ease-in-out infinite alternate}
.walking .pc .legs{animation:legs .3s ease-in-out infinite alternate}

/* ---------- 山路 ---------- */
.cover{position:relative;margin:8px 0 0;padding:14px 16px 13px;border:1.5px solid var(--ink);border-radius:6px 6px 14px 14px;background:var(--card);box-shadow:3px 4px 0 rgba(36,50,74,.12);transform:rotate(-.6deg)}
.cover::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;margin-left:-48px;background:rgba(237,189,85,.82);border:1px solid rgba(36,50,74,.22);transform:rotate(-3deg)}
.cover h1{margin:1px 0 0;font-family:var(--hand);font-size:29px;line-height:1.2}
.cover .sub{margin:1px 0 9px;font-family:var(--hand);font-size:15px;color:var(--ink2)}
.stks{display:flex;flex-wrap:wrap;gap:8px}
.stk{display:inline-block;padding:2px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--c);font-family:var(--hand);font-size:13px;font-weight:700}
.stk:nth-child(1){--c:#9cc2a5;transform:rotate(-3deg)}
.stk:nth-child(2){--c:#9cbfe0;transform:rotate(2deg)}
.stk:nth-child(3){--c:#f0a29a;transform:rotate(-1.5deg)}
.map-wrap{position:relative;height:440px;margin:18px 0 0}
.map-t{position:absolute;left:2px;top:0;z-index:2;max-width:170px}
.map-t h2{margin:0;font-family:var(--hand);font-size:24px;line-height:1.2}
.map-t p{margin:1px 0 0;font-family:var(--hand);font-size:13px;font-weight:700;color:var(--ink2)}
.map{position:absolute;left:0;top:0;width:342px;height:440px;transform-origin:0 0}
.map-art{position:absolute;left:0;top:0;width:342px;height:440px;overflow:visible}
.map-art .cl1{animation:drift 9s ease-in-out infinite}
.map-art .cl2{animation:drift 12s ease-in-out -4s infinite}
.map-art .sf{transform-box:fill-box;transform-origin:0 50%;animation:sway 2s ease-in-out infinite}
.map-art .sum-flag{transition:opacity .5s ease 1.2s}
.map.done .sum-flag{opacity:0}
.tr-ok{transition:stroke-dashoffset 1.4s cubic-bezier(.45,.05,.35,1)}
.node{position:absolute;z-index:2;width:0;height:0;color:var(--ink);text-decoration:none}
.node .ring{position:absolute;left:-20px;top:-20px;display:flex;align-items:flex-end;justify-content:center;width:40px;height:40px;padding-bottom:6px;border:2px solid var(--ink);border-radius:50%;background:var(--card)}
.node.lit .ring{background:#ffe9b0}
.node.next .ring{box-shadow:0 0 0 4px rgba(200,67,58,.25);animation:ring 1.8s ease-in-out infinite}
.node .tag{position:absolute;top:-13px;display:flex;align-items:center;gap:4px;height:26px;padding:0 9px;border:1.5px solid var(--ink);border-radius:4px;background:var(--c);box-shadow:2px 2px 0 rgba(36,50,74,.15);font-family:var(--hand);font-size:13px;font-weight:700;white-space:nowrap}
.node.l .tag{right:26px;transform:rotate(-2deg)}
.node.r .tag{left:26px;transform:rotate(2deg)}
.fi-on,.fi-off{display:block}
.lit .fi-off,.camp:not(.lit) .fi-on,.node:not(.lit) .fi-on{display:none}
.fi-on .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
.summit{position:absolute;left:198px;top:4px;z-index:3;display:flex;flex-direction:column;gap:2px;width:138px;padding:7px 9px 8px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);box-shadow:var(--sh)}
.summit b{font-family:var(--hand);font-size:14.5px;line-height:1.3}
.summit small{font-size:11.5px;line-height:1.4;color:var(--ink2)}
.flare-btn{min-height:34px;margin-top:4px;border:1.5px solid var(--ink);border-radius:999px;background:var(--stamp);color:#fff;font-family:var(--hand);font-size:13px;font-weight:700;cursor:pointer}
.walker{position:absolute;left:0;top:0;z-index:6;width:0;height:0;offset-path:path('M150 424C140 408 114 400 114 376C114 346 228 336 228 306C228 274 120 266 120 232C120 198 212 190 212 158C212 116 171 86 171 40');offset-rotate:0deg;offset-distance:0%;transition:offset-distance var(--wd,0s) cubic-bezier(.45,.05,.35,1),transform var(--wd,0s) cubic-bezier(.45,.05,.35,1)}
.walker-in{position:absolute;left:-26px;bottom:-3px;width:52px;height:52px;padding:0;border:0;background:none;cursor:pointer;transform:translateX(var(--sx,0px));transition:transform var(--wd,0s) cubic-bezier(.45,.05,.35,1)}
.walker .bub{bottom:56px;translate:var(--sx,0px) 0;transition:opacity .2s ease,transform .28s cubic-bezier(.34,1.56,.64,1),translate var(--wd,0s) cubic-bezier(.45,.05,.35,1)}
.walker .bub.to-r{left:-14px;border-bottom-left-radius:4px}
.walker .bub.to-l{right:-14px;border-bottom-right-radius:4px}
.rocket{position:absolute;left:165px;top:6px;z-index:7;width:12px;height:12px;border-radius:50%;background:#ff5a3c;box-shadow:0 0 12px #ff5a3c,0 18px 14px -6px #ffb43b;animation:rise 1.6s ease-out forwards}
.boom{position:absolute;left:126px;top:-102px;z-index:7;width:90px;height:90px;overflow:visible;animation:boom 1.6s ease-out forwards}
.camps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.camp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:8px;row-gap:7px;height:100%;padding:10px 10px 10px 8px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:var(--sh);color:var(--ink);text-decoration:none}
.camp .cf{grid-row:1/3;display:flex;align-items:flex-end;justify-content:center;width:40px;height:40px;padding-bottom:6px;border:2px solid var(--ink);border-radius:50%;background:var(--card)}
.camp.lit .cf{background:#ffe9b0}
.camp .cm{display:flex;flex-direction:column;min-width:0}
.camp .cm b{font-family:var(--hand);font-size:15px;line-height:1.25}
.camp .cm small{font-size:11.5px;color:var(--ink2)}
.camp .cc{font-family:var(--num);font-size:19px;font-weight:700;line-height:1}
.camp .cbar{grid-column:2/4;position:relative;height:7px;overflow:hidden;border-radius:99px;background:#eadfca}
.camp .cbar i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v,0)*100%);border-radius:99px;background:var(--c);transition:width .5s ease}
.sash{position:relative;margin:20px 0 4px;padding:14px 12px 12px;border:1.5px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(135deg,#6f8f5a 0 14px,#7a9a64 14px 28px);box-shadow:3px 4px 0 rgba(36,50,74,.12);transform:rotate(-.8deg)}
.sash h2{display:inline-block;margin:0 0 10px;padding:1px 10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);font-family:var(--hand);font-size:15px}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:3px}
.bdg span{display:flex;align-items:center;justify-content:center;width:44px;max-width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:50%;background:#d9d2c2;box-shadow:inset 0 0 0 3px #d9d2c2,inset 0 0 0 5px #bfb6a3;color:#8b8373}
.bdg.got span{background:var(--c);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 5px var(--card);color:var(--ink)}
.bdg.new span{animation:stampIn .6s cubic-bezier(.2,1.4,.4,1) both}
.bdg svg{width:20px;height:20px}
.bdg small{font-family:var(--hand);font-size:11.5px;font-weight:700;color:#fffdf8;white-space:nowrap}

/* ---------- 清單（手帳內頁） ---------- */
.book{display:grid;grid-template-columns:minmax(0,1fr) 52px;margin-right:-16px}
.page{position:relative;min-height:580px;padding:16px 14px 28px 36px;border:1.5px solid var(--ink);border-radius:6px 0 0 6px;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 23.5px,transparent 23.5px),repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);box-shadow:-3px 4px 0 rgba(36,50,74,.1)}
.flip{position:absolute;inset:-1.5px;z-index:9;border-radius:6px 0 0 6px;transform-origin:left center;background-color:var(--paper);background-image:linear-gradient(90deg,rgba(36,50,74,.08),transparent 30%,transparent 80%,rgba(36,50,74,.12)),repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);box-shadow:8px 0 18px rgba(36,50,74,.2);pointer-events:none;animation:pageTurn .6s ease-in forwards}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pg-tt{min-width:0}
.pg-t1{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.pg-t1 h1{margin:0;font-family:var(--hand);font-size:28px;line-height:1.2}
.pg-n{padding:0 9px;border:1.5px solid var(--ink);border-radius:999px;background:var(--c);font-family:var(--num);font-size:18px;font-weight:700;white-space:nowrap;transform:rotate(4deg)}
.squig{display:block;margin-top:2px}
.pg-cap{margin:6px 0 0;font-family:var(--hand);font-size:14.5px;color:var(--ink2)}
.pg-lead{margin:8px 0 0;font-size:12.5px;color:var(--ink3)}
.done-stamp{display:inline-block;margin:8px 0 0 2px;padding:3px 12px;border:4px double var(--stamp);border-radius:10px;background:rgba(251,246,234,.85);color:var(--stamp);font-family:var(--hand);font-size:19px;font-weight:700;transform:rotate(-8deg)}
.done-stamp.in{animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
.illo{flex:none;width:104px;height:84px;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 5px rgba(36,50,74,.18))}
.illo svg{display:block;width:104px;height:84px;overflow:visible}
.illo.pop-a{animation:popA .5s ease-out}
.illo.pop-b{animation:popB .5s ease-out}
.tent .t-bag,.tent .t-poles,.tent .t-flag{transition:opacity .4s ease}
.tent .t-body{transform-origin:60px 84px;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
.tent[data-st="0"] .t-poles,.tent[data-st="0"] .t-flag{opacity:0}
.tent:not([data-st="0"]) .t-bag{opacity:0}
.tent[data-st="0"] .t-body,.tent[data-st="1"] .t-body{transform:scaleY(.05);opacity:0}
.tent:not([data-st="3"]) .t-flag{opacity:0}
.steam path{animation:steam 2.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.5s}
.steam path:nth-child(3){animation-delay:.9s}
.steam{transition:opacity .5s ease}
.pot-fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .7s ease-in-out infinite alternate}

  function confetti(count) {
    if (reduce) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    document.body.appendChild(cv);
    const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d');

    g.scale(dpr, dpr);
    const cols = ['#edbd55', '#f06a3a', '#c8433a', '#9cc2a5', '#9cbfe0', '#f0a29a', '#9b87c6'];
    const P = Array.from({ length: count || 120 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.4, y: H * 0.38,
      vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 5,
      s: 6 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      c: cols[Math.floor(Math.random() * cols.length)], dot: Math.random() < 0.3

        g.restore();

    };

  function pointAt(f) {
    for (let i = 0; i < ORDER.length - 1; i++) {
      const a = ORDER[i], b = ORDER[i + 1];
      if (f <= CF[b] || i === ORDER.length - 2) {
        const t = clamp((f - CF[a]) / ((CF[b] - CF[a]) || 1), 0, 1);
        return { x: NODE[a][0] + (NODE[b][0] - NODE[a][0]) * t, y: NODE[a][1] + (NODE[b][1] - NODE[a][1]) * t };
      }
    }
    return { x: NODE.summit[0], y: NODE.summit[1] };
  }
  function trailTarget() {
    const i = firstOpen();
    if (i < 0) return { f: 1, sx: SX.summit };

    const S = SEC[k], q = Math.min(pct(secCount(k), S.items.length), 0.9);

    walkDur = dur;
    w.style.setProperty('--wd', dur + 's');
    ok.style.transitionDuration = dur + 's';
    w.style.setProperty('--sx', sx + 'px');
    if (HAS_OFFSET) w.style.offsetDistance = (f * 100).toFixed(3) + '%';
    else { const p = pointAt(f); w.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)'; }
    ok.style.strokeDashoffset = (100 - f * 100).toFixed(3);
    clearTimeout(walkT);
    if (dur > 0) { w.classList.add('walking'); walkT = setTimeout(() => w.classList.remove('walking'), dur * 1000); }
    else w.classList.remove('walking');

    bub.classList.toggle('to-l', x >= 171);

  /* ---------- 勾選 ---------- */
  function snap() { const o = {}; SECS.forEach(k => { o[k] = secFull(k); }); o.all = allDone(); return o; }
  function toggleItem(id, on) {
    const it = ITEM[id];
    if (!it) return;
    const before = snap();
    if (it.sec === 'me') { if (on) MINE[id] = true; else delete MINE[id]; saveMine(); }
    else { if (on) DONE[id] = true; else delete DONE[id]; saveDone(); }
    if (on) alt(ROW[id], 'bst-a', 'bst-b');
    updateAll();
    if (!on) return;
    hop($('#side-pc'));
    mood($('#side-pc'), 'cheer', 800);
    alt($('#illo'), 'pop-a', 'pop-b');
    const after = snap();
    if (!before[it.sec] && after[it.sec]) {
      const S = SEC[it.sec], b = BADGES.find(x => x.key === it.sec);
      const stamp = $('#done-stamp');
      stamp.classList.remove('in'); void stamp.offsetWidth; stamp.classList.add('in');
      mood($('#side-pc'), 'cheer', 2000);
      if (after.all) {
        toast('全部備妥！到「山路」看攻頂信號彈', true);
        confetti(170);
      } else {
        toast(S.camp + '完成！拿到「' + b.label + '」徽章，營火邊多一支棉花糖', true);
        confetti(70);
      }
      say($('#side-bub'), S.camp + '完成！', 2600);
    }
  }

  /* ---------- 營火：烤棉花糖 ---------- */
  const ROAST = { on: false, heat: 0, last: 0, raf: 0, practice: false };
  const STOPS = [[0, [255, 250, 240]], [40, [246, 223, 165]], [65, [227, 169, 90]], [85, [156, 90, 44]], [100, [43, 37, 34]]];
  function heatColor(h) {
    for (let i = 0; i < STOPS.length - 1; i++) {
      const a = STOPS[i], b = STOPS[i + 1];
      if (h <= b[0]) {
        const t = (h - a[0]) / (b[0] - a[0]);
        return 'rgb(' + [0, 1, 2].map(k => Math.round(a[1][k] + (b[1][k] - a[1][k]) * t)).join(',') + ')';
      }
    }
    return 'rgb(43,37,34)';
  }
  const grade = h => (h < 20 ? 'raw' : h < 55 ? 'light' : h < 75 ? 'perfect' : h < 92 ? 'toasted' : 'burnt');
  const RESULT = { raw: '還是生的，再多烤一下', light: '淡淡金黃，差一點點', perfect: '完美金黃！', toasted: '焦香版，也不錯吃', burnt: '烤焦了…變成黑炭' };
  function paintHeat() {
    const h = ROAST.heat;
    $('#heat-ptr').style.left = h.toFixed(1) + '%';
    $('#mallow').setAttribute('fill', heatColor(h));
    $('#scene').classList.toggle('smoky', ROAST.on && h > 85);
    $('#scene-pc').classList.toggle('nervous', ROAST.on && h > 80);
  }
  function roastTick(t) {
    if (!ROAST.on) return;
    const dt = Math.min(0.1, (t - ROAST.last) / 1000);
    ROAST.last = t;
    ROAST.heat = Math.min(100, ROAST.heat + dt * 42);
    paintHeat();
    if (ROAST.heat >= 100) roastStop();
    else ROAST.raf = requestAnimationFrame(roastTick);
  }
  function roastStart() {
    if (ROAST.on) return;
    ROAST.on = true;
    ROAST.practice = supply() <= 0;
    ROAST.heat = 0;
    ROAST.last = performance.now();
    const btn = $('#roast-btn');
    btn.classList.add('on');
    setText(btn, '烤中…放開就停');
    $('#scene').classList.add('roasting');
    $('#say').classList.remove('show');
    const pc = $('#scene-pc');
    pc.classList.remove('oops', 'yay', 'cheer', 'nervous');
    paintHeat();
    ROAST.raf = requestAnimationFrame(roastTick);
  }
  function roastStop() {
    if (!ROAST.on) return;
    ROAST.on = false;
    cancelAnimationFrame(ROAST.raf);
    const g = grade(ROAST.heat), hadBadge = FIRE.perfect > 0;
    if (!ROAST.practice) {
      FIRE.used += 1;
      if (g === 'perfect') FIRE.perfect += 1;
      if (g === 'burnt') FIRE.burnt += 1;
      saveFire();
    }
    $('#roast-btn').classList.remove('on');
    $('#scene').classList.remove('roasting', 'smoky');
    $('#heat').setAttribute('aria-label', '火候 ' + Math.round(ROAST.heat) + '%，完美區間是 55% 到 75%');
    say($('#say'), (ROAST.practice ? '練習：' : '') + RESULT[g], 3600);
    const pc = $('#scene-pc');
    pc.classList.remove('nervous');
    if (g === 'perfect') { mood(pc, 'yay', 1800); hop(pc); }
    else if (g === 'burnt') mood(pc, 'oops', 1800);
    updateAll();
    if (!ROAST.practice && g === 'perfect' && !hadBadge) toast('拿到「烤棉花糖」徽章！', true);
  }

  /* ---------- 分頁切換 ---------- */
  function hdH() { const h = $('#hd'); return h ? h.offsetHeight : 96; }
  function syncHd() { document.documentElement.style.setProperty('--hd-h', hdH() + 'px'); }
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    let v = 'trail', sec = null;
    if (SEC[h]) { v = 'list'; sec = h; }
    else if (h === 'list') v = 'list';
    else if (h === 'fire') v = 'fire';
    else if (h === 'share') v = 'share';
    const changed = v !== VIEW;
    if (ROAST.on && v !== 'fire') roastStop();
    VIEW = v;
    if (sec) setSection(sec, { flip: !changed && !PENDING });
    ['trail', 'list', 'fire', 'share'].forEach(k => { $('#v-' + k).hidden = k !== v; });
    $$('.tb a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (changed && !PENDING) window.scrollTo(0, 0);
    if (v === 'trail') onTrailShow();
    if (PENDING) applyPending();
  }

  /* ---------- 互動 ---------- */
  function setCopyTab(t) {
    copyTab = t;
    $('#tab-team').setAttribute('aria-selected', String(t === 'team'));
    $('#tab-me').setAttribute('aria-selected', String(t === 'me'));
    renderCopy();
  }
  async function copyText(btn) {
    const ta = $('#copy-ta'), txt = ta.value;
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, txt.length); ok = !!document.execCommand('copy'); } catch (e) { ok = false; }
    }
    if (ok) {
      btn.textContent = '已複製';
      setTimeout(() => { btn.textContent = '複製文字'; }, 1800);
      toast('已複製，可以貼到 LINE 群組');
    } else toast('已幫你選取文字，長按就能複製');
  }
  async function shareText() {
    try { await navigator.share({ text: $('#copy-ta').value }); }
    catch (e) { if (!e || e.name !== 'AbortError') toast('沒辦法開啟分享選單，改用「複製文字」'); }
  }
  function twoStep(btn, label, run) {
    if (!btn._arm) {
      btn.textContent = '再按一次確認';
      btn._arm = setTimeout(() => { btn._arm = 0; btn.textContent = label; }, 3000);
      return;
    }
    clearTimeout(btn._arm);
    btn._arm = 0;
    btn.textContent = label;
    run();
  }

  document.addEventListener('change', e => {
    const t = e.target;
    if (t && t.classList && t.classList.contains('ck-in')) toggleItem(t.dataset.id, t.checked);
  });
  document.addEventListener('click', e => {
    const el = e.target instanceof Element ? e.target : null;
    if (!el) return;
    const chip = el.closest('.chip[data-need]');
    if (chip) { jumpNeed(chip.dataset.need); return; }
    const ix = el.closest('.ix');
    if (ix) { setSection(ix.dataset.sec, { flip: true, hash: true, scroll: true }); return; }
    const b = el.closest('button');
    if (!b) return;
    switch (b.id) {
      case 'walker-btn': { const L = trailHints(); say($('#walker-bub'), L[hintI++ % L.length], 4600); peek($('#walker-pc')); break; }
      case 'pc-side': sideHint(); break;
      case 'scene-pc-btn': say($('#say'), ROAST.on ? '放開就停！' : '按住下面的按鈕開始烤，指針到「完美」就放開', 3600); hop($('#scene-pc')); break;
      case 'flare-btn': flare(true); break;
      case 'copy-btn': copyText(b); break;
      case 'text-share': shareText(); break;
      case 'tab-team': setCopyTab('team'); break;
      case 'tab-me': setCopyTab('me'); break;
      case 'reset-team': twoStep(b, '清除公共勾選', () => { DONE = {}; saveDone(); updateAll(); toast('已清除公共裝備、炊具和營區確認的勾選'); }); break;
      case 'reset-me': twoStep(b, '清除行李勾選', () => { MINE = {}; saveMine(); updateAll(); toast('已清除你的行李勾選'); }); break;
      case 'reset-fire': twoStep(b, '重設營火紀錄', () => { FIRE = { used: 0, perfect: 0, burnt: 0 }; saveFire(); updateAll(); toast('營火紀錄已重設，棉花糖重新發放'); }); break;
      default: break;
    }
  });
  document.addEventListener('keydown', e => {
    const ix = e.target instanceof Element ? e.target.closest('.ix') : null;
    if (!ix) return;
    const i = SECS.indexOf(ix.dataset.sec);
    let j = -1;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = (i + 1) % SECS.length;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = (i + SECS.length - 1) % SECS.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = SECS.length - 1;
    if (j < 0) return;
    e.preventDefault();
    setSection(SECS[j], { flip: true, hash: true, scroll: true });
    $('#ix-' + SECS[j]).focus();
  });

  /* ---------- 啟動 ---------- */
  app.innerHTML = appHTML();
  $$('.row').forEach(li => { ROW[li.dataset.id] = li; });
  if (navigator.share) $('#text-share').hidden = false;

  const rb = $('#roast-btn');
  rb.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    try { rb.setPointerCapture(e.pointerId); } catch (err) { /* 略過 */ }
    roastStart();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => rb.addEventListener(ev, roastStop));
  rb.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); roastStart(); } });
  rb.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); roastStop(); } });
  rb.addEventListener('contextmenu', e => e.preventDefault());

  try { history.scrollRestoration = 'manual'; } catch (e) { /* 略過 */ }
  /* 舊版的分享連結（#s=…）已停用，打開時直接清掉 */
  if (location.hash.indexOf('#s=') === 0) { try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { /* 略過 */ } }

  renderCountdown();
  updateAll();
  paintHeat();
  syncHd();
  route();
  window.addEventListener('hashchange', route);
  let lw = innerWidth;
  window.addEventListener('resize', () => { syncHd(); if (innerWidth !== lw) { lw = innerWidth; scaleMap(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHd).catch(() => {});
  /* 跨過午夜時更新倒數 */
  setInterval(renderCountdown, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') renderCountdown();
    else if (ROAST.on) roastStop();
  });
})();
</script>
</body>
</html>
